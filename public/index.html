<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Campus Lost &amp; Found</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <h1>Campus Lost &amp; Found</h1>
    <button id="postItemBtn" type="button">Post an item</button>
  </header>

  <main>
    <div class="filter-bar">
      <div class="type-toggle">
        <button type="button" class="toggle-btn active" data-type="">All</button>
        <button type="button" class="toggle-btn" data-type="lost">Lost</button>
        <button type="button" class="toggle-btn" data-type="found">Found</button>
      </div>

      <select id="categoryFilter">
        <option value="">All categories</option>
        <option value="electronics">Electronics</option>
        <option value="documents">Documents</option>
        <option value="keys">Keys</option>
        <option value="clothing">Clothing</option>
        <option value="books">Books</option>
        <option value="other">Other</option>
      </select>

      <input type="text" id="searchInput" placeholder="Search title, description, location...">

      <label class="checkbox-label">
        <input type="checkbox" id="showClaimed">
        Show claimed items
      </label>
    </div>

    <div id="results" class="card-grid"></div>
  </main>

  <script src="app.js"></script>
</body>
</html>
